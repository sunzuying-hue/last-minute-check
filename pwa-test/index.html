<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FCFBF8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="出门前"><title>出门前最后一分钟</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png"><link rel="stylesheet" href="style.css"><script src="pwa.js"></script></head>
<body><main id="app"></main><dialog id="forgetDialog" aria-labelledby="forgetTitle"><form method="dialog" id="forgetForm"><header class="forget-header"><button class="back" value="cancel">〈 返回检查</button><p class="eyebrow" id="forgetScene"></p><h2 id="forgetTitle">刚才，忘了什么？</h2><p>轻点选择，可记录多件物品。</p></header><div id="forgetScroll" tabindex="0" role="region" aria-label="遗漏物品，可上下滚动"><div id="forgetBoard" role="group" aria-label="选择遗漏的固定物品"></div></div><footer class="forget-footer"><p id="forgetCount" role="status">已选择 0 件</p><button id="recordForget" class="primary full" disabled>确认记录</button></footer></form></dialog><dialog id="customItemDialog" aria-labelledby="customItemTitle"><form id="customItemForm"><h2 id="customItemTitle">添加物品</h2><label for="customItemName">物品名称</label><input id="customItemName" maxlength="60" autocomplete="off" required autofocus><p id="customItemError" role="status"></p><div class="actions"><button type="button" id="cancelCustomItem">取消</button><button type="submit" id="confirmCustomItem" class="primary" disabled>确认</button></div></form></dialog><dialog id="sceneDeleteDialog" aria-labelledby="sceneDeleteTitle" aria-describedby="sceneDeleteDescription">
  <h2 id="sceneDeleteTitle"></h2>
  <p id="sceneDeleteDescription">删除后将无法恢复这个场景。</p>
  <div class="actions">
    <button type="button" id="cancelSceneDelete" autofocus>取消</button>
    <button type="button" id="confirmSceneDelete" class="primary">确认删除</button>
  </div>
</dialog><dialog id="tempItemDialog" aria-labelledby="tempItemTitle"><section class="temp-sheet"><header><div><h2 id="tempItemTitle">临时物品</h2><p>只参与本次检查，不会加入长期场景</p></div><button type="button" id="closeTempItems" aria-label="关闭临时物品面板"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></header><div class="temp-sheet-body"><section aria-labelledby="tempLibraryTitle"><h3 id="tempLibraryTitle">从物品库选择</h3><label class="temp-search"><span class="sr-only">搜索物品库</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.5" stroke="currentColor" stroke-width="1.35"/><path d="m12 12 4 4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg><input type="search" id="tempItemSearch" placeholder="搜索物品"></label><div id="tempLibraryOptions" class="temp-library-options" role="group" aria-label="物品库"></div><p id="tempLibraryEmpty" class="temp-empty" hidden>没有找到相关物品</p></section><section class="temp-custom" aria-labelledby="tempCustomTitle"><h3 id="tempCustomTitle">自定义临时物品</h3><form id="tempItemForm" novalidate><div><label class="sr-only" for="tempItemName">临时物品名称</label><input id="tempItemName" maxlength="60" autocomplete="off" placeholder="输入临时物品名称"><button type="submit">添加</button></div><p id="tempItemNotice" role="status"></p></form></section></div></section></dialog><dialog id="themeDialog" aria-labelledby="themeTitle"><section class="theme-sheet"><header><div><h2 id="themeTitle">选择主题</h2><p>选择你喜欢的配色</p></div><button type="button" id="closeThemeDialog" aria-label="关闭主题面板"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></header><div class="theme-sheet-body"><div id="themeOptions" class="theme-options" role="group" aria-label="主题配色"></div><section class="theme-preview" aria-labelledby="themePreviewTitle"><div><h3 id="themePreviewTitle">场景预览</h3><span id="themePreviewName"></span></div><div id="themeScenePreview" class="theme-scene-preview"></div></section></div><footer><button type="button" id="applyTheme" class="primary">使用这个主题</button></footer></section></dialog><script src="art-loader.js"></script><script src="app.js"></script></body>
</html>
