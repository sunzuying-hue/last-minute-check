<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出门前最后一分钟</title><link rel="stylesheet" href="style.css?v=f6b1d3e39d"></head>
<body><main id="app"></main><dialog id="forgetDialog" aria-labelledby="forgetTitle"><form method="dialog" id="forgetForm"><header class="forget-header"><button class="back" value="cancel">〈 返回检查</button><p class="eyebrow" id="forgetScene"></p><h2 id="forgetTitle">刚才，忘了什么？</h2><p>轻点选择，可记录多件物品。</p></header><div id="forgetScroll" tabindex="0" role="region" aria-label="遗漏物品，可上下滚动"><div id="forgetBoard" role="group" aria-label="选择遗漏的固定物品"></div></div><footer class="forget-footer"><p id="forgetCount" role="status">已选择 0 件</p><button id="recordForget" class="primary full" disabled>确认记录</button></footer></form></dialog><dialog id="customItemDialog" aria-labelledby="customItemTitle"><form id="customItemForm"><h2 id="customItemTitle">添加物品</h2><label for="customItemName">物品名称</label><input id="customItemName" maxlength="60" autocomplete="off" required autofocus><p id="customItemError" role="status"></p><div class="actions"><button type="button" id="cancelCustomItem">取消</button><button type="submit" id="confirmCustomItem" class="primary" disabled>确认</button></div></form></dialog><dialog id="sceneDeleteDialog" aria-labelledby="sceneDeleteTitle" aria-describedby="sceneDeleteDescription">
  <h2 id="sceneDeleteTitle"></h2>
  <p id="sceneDeleteDescription">删除后将无法恢复这个场景。</p>
  <div class="actions">
    <button type="button" id="cancelSceneDelete" autofocus>取消</button>
    <button type="button" id="confirmSceneDelete" class="primary">确认删除</button>
  </div>
</dialog><script src="art-loader.js?v=f6b1d3e39d"></script><script src="app.js?v=f6b1d3e39d"></script></body>
</html>
